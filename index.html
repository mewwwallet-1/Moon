<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MOON Wallet</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#050816;
color:white;
display:flex;
justify-content:center;
padding:20px;
min-height:100vh;
}

.app{
width:100%;
max-width:430px;
background:#0b1023;
border-radius:30px;
overflow:hidden;
box-shadow:0 0 40px rgba(0,255,255,.15);
position:relative;
}

/* HEADER */

.header{
padding:25px 20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:28px;
font-weight:700;
color:#00e5ff;
}

.notify{
font-size:22px;
}

/* AUTH */

.auth{
padding:20px;
display:flex;
flex-direction:column;
gap:15px;
}

.auth-title{
font-size:30px;
font-weight:700;
margin-bottom:10px;
}

input{
padding:16px;
border:none;
outline:none;
border-radius:15px;
background:#121933;
color:white;
font-size:15px;
}

button{
padding:16px;
border:none;
border-radius:15px;
background:linear-gradient(135deg,#00e5ff,#7f5cff);
color:white;
font-weight:600;
font-size:16px;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:translateY(-3px);
}

/* DASHBOARD */

.dashboard{
display:none;
padding-bottom:100px;
}

/* PROFILE */

.profile{
display:flex;
align-items:center;
gap:12px;
padding:0 20px;
}

.avatar{
width:50px;
height:50px;
background:#121933;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
font-size:22px;
}

.small{
font-size:12px;
opacity:.7;
}

/* BALANCE */

.balance-card{
margin:25px 20px;
padding:25px;
border-radius:25px;
background:linear-gradient(135deg,#00e5ff,#7f5cff);
box-shadow:0 0 30px rgba(0,255,255,.3);
}

.balance{
font-size:38px;
font-weight:700;
margin-top:10px;
}

.card-number{
margin-top:20px;
letter-spacing:2px;
font-size:14px;
}

/* ACTIONS */

.actions{
display:flex;
justify-content:space-between;
padding:0 20px 25px;
}

.action{
width:72px;
height:72px;
background:#121933;
border-radius:20px;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
font-size:12px;
gap:5px;
}

.icon{
font-size:24px;
}

/* SECTION */

.section{
padding:0 20px;
margin-top:10px;
}

.section-title{
font-size:18px;
font-weight:600;
margin-bottom:15px;
}

.card{
background:#121933;
padding:18px;
border-radius:20px;
margin-bottom:15px;
}

.row{
display:flex;
justify-content:space-between;
align-items:center;
}

.green{
color:#00ff99;
font-weight:600;
}

.red{
color:#ff4f7b;
font-weight:600;
}

/* TRANSACTIONS */

.transaction{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:18px;
}

.left{
display:flex;
align-items:center;
gap:12px;
}

.circle{
width:45px;
height:45px;
background:#1b2348;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
}

/* BOTTOM NAV */

.bottom{
position:fixed;
bottom:0;
width:100%;
max-width:430px;
background:#0d1328;
padding:18px 10px;
display:flex;
justify-content:space-around;
border-top:1px solid rgba(255,255,255,.08);
}

.nav{
display:flex;
flex-direction:column;
align-items:center;
font-size:12px;
opacity:.7;
}

.active{
opacity:1;
color:#00e5ff;
}

</style>
</head>

<body>

<div class="app">

<!-- HEADER -->

<div class="header">
<div class="logo">MOON 🌙</div>
<div class="notify">🔔</div>
</div>

<!-- AUTH -->

<div class="auth" id="authBox">

<div class="auth-title">
Create Account
</div>

<input type="text" id="name" placeholder="Full Name">

<input type="email" id="email" placeholder="Email">

<input type="password" id="password" placeholder="Password">

<button onclick="createAccount()">
Create Account
</button>

<button onclick="login()">
Login
</button>

</div>

<!-- DASHBOARD -->

<div class="dashboard" id="dashboard">

<div class="profile">

<div class="avatar">
👤
</div>

<div>

<div id="welcomeUser">
User
</div>

<div class="small">
Welcome back
</div>

</div>

</div>

<!-- BALANCE -->

<div class="balance-card">

<div class="small">
Available Balance
</div>

<div class="balance">
₦245,000
</div>

<div class="card-number">
**** **** **** 2048
</div>

</div>

<!-- ACTIONS -->

<div class="actions">

<div class="action">
<div class="icon">💰</div>
Deposit
</div>

<div class="action">
<div class="icon">📤</div>
Send
</div>

<div class="action">
<div class="icon">🏦</div>
Withdraw
</div>

<div class="action">
<div class="icon">₿</div>
Crypto
</div>

</div>

<!-- MARKET -->

<div class="section">

<div class="section-title">
Live Market
</div>

<div class="card">

<div class="row">
<div>Bitcoin</div>
<div class="green">+4.6%</div>
</div>

</div>

<div class="card">

<div class="row">
<div>Ethereum</div>
<div class="red">-1.2%</div>
</div>

</div>

</div>

<!-- TRANSACTIONS -->

<div class="section">

<div class="section-title">
Recent Transactions
</div>

<div class="card">

<div class="transaction">

<div class="left">

<div class="circle">
⬇️
</div>

<div>
<div>Deposit</div>
<div class="small">Today</div>
</div>

</div>

<div class="green">
+ ₦50,000
</div>

</div>

<div class="transaction">

<div class="left">

<div class="circle">
⬆️
</div>

<div>
<div>Transfer</div>
<div class="small">
Yesterday
</div>
</div>

</div>

<div class="red">
- ₦12,000
</div>

</div>

</div>

</div>

<!-- BOTTOM NAV -->

<div class="bottom">

<div class="nav active">
🏠
<div>Home</div>
</div>

<div class="nav">
💳
<div>Wallet</div>
</div>

<div class="nav">
📈
<div>Market</div>
</div>

<div class="nav">
🎁
<div>Rewards</div>
</div>

<div class="nav">
👤
<div>Profile</div>
</div>

</div>

</div>

<script>

function createAccount(){

let name =
document.getElementById("name").value;

let email =
document.getElementById("email").value;

let password =
document.getElementById("password").value;

if(name===""||email===""||password===""){

alert("Fill all fields");

return;

}

localStorage.setItem("moonName",name);

localStorage.setItem("moonEmail",email);

localStorage.setItem("moonPassword",password);

alert("Account Created");

showDashboard();

}

function login(){

let email =
document.getElementById("email").value;

let password =
document.getElementById("password").value;

let savedEmail =
localStorage.getItem("moonEmail");

let savedPassword =
localStorage.getItem("moonPassword");

if(email===savedEmail &&
password===savedPassword){

showDashboard();

}else{

alert("Invalid Login");

}

}

function showDashboard(){

document.getElementById("authBox").style.display="none";

document.getElementById("dashboard").style.display="block";

document.getElementById("welcomeUser").innerHTML =
localStorage.getItem("moonName");

}

</script>

</body>
</html>
